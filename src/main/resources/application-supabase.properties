# Explicit safe deployment profile. Migrations are never enabled by server startup.
spring.datasource.username=${DB_RUNTIME_USERNAME}
spring.datasource.password=${DB_RUNTIME_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.flyway.locations=classpath:db/migration-safe
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
app.auth.expose-tokens=false
app.bootstrap-admin-email=
app.auth.mail-required=true
