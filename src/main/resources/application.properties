spring.application.name=eventflow-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:5080}

springdoc.swagger-ui.path=/swagger-ui

spring.security.user.name=admin
spring.security.user.password=1234

jwt.secret=${JWT_SECRET}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.time-zone=UTC
management.endpoints.web.exposure.include=health,info,metrics

app.frontend-url=${FRONTEND_URL:http://localhost:8081}
app.auth.expose-tokens=${AUTH_EXPOSE_TOKENS:false}
app.auth.deletion-grace-days=${ACCOUNT_DELETION_GRACE_DAYS:30}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${SUPABASE_BUCKET:eventflow}
app.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
