spring.application.name=eventflow-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Cloud Run supplies PORT at runtime; keep it authoritative over local SERVER_PORT.
server.port=${PORT:${SERVER_PORT:5080}}

springdoc.swagger-ui.path=/swagger-ui

jwt.secret=${JWT_SECRET}
app.survey-anonymity-key=${SURVEY_ANONYMITY_KEY:${JWT_SECRET}}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Schema changes are an explicit operator action, never implicit server startup.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.jackson.time-zone=UTC
management.endpoints.web.exposure.include=health,info,metrics
# SMTP is optional and its availability must not make the API unhealthy.
management.health.mail.enabled=false

app.frontend-url=${FRONTEND_URL:http://localhost:8081}
app.auth.expose-tokens=${AUTH_EXPOSE_TOKENS:false}
app.auth.deep-link-base=${AUTH_DEEP_LINK_BASE:eventflow://auth}
app.auth.mail-required=${AUTH_MAIL_REQUIRED:false}
app.auth.mail-from=${MAIL_FROM:}
app.auth.deletion-grace-days=${ACCOUNT_DELETION_GRACE_DAYS:30}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.push.expo-access-token=${EXPO_PUSH_ACCESS_TOKEN:}
app.push.expo-endpoint=${EXPO_PUSH_ENDPOINT:https://exp.host/--/api/v2/push/send}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
app.storage.provider=${APP_STORAGE_PROVIDER:supabase}
app.storage.url=${SUPABASE_URL:}
app.storage.service-key=${SUPABASE_SERVICE_KEY:}
app.storage.bucket=${APP_STORAGE_BUCKET:${SUPABASE_BUCKET:eventflow}}
app.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
